name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-artifacts:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target "${{ matrix.target }}"

      - name: Package artifact
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          artifact="meow-${version}-${{ matrix.target }}"
          package_dir="dist/${artifact}"
          mkdir -p "${package_dir}"
          cp "target/${{ matrix.target }}/release/meow" "${package_dir}/meow"
          cp README.md LICENSE "${package_dir}/"
          tar -C dist -czf "dist/${artifact}.tar.gz" "${artifact}"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: meow-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-release:
    needs: build-artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.tar.gz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no artifacts found" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > dist/SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
