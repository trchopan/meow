[package]
name = "meow"
version = "0.2.0"
edition = "2024"
default-run = "meow"

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
bincode = "1.3"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
iroh = "1.0.3"
iroh-blobs = "0.103"
libc = "0.2"
rand = "0.8"
rdev = { git = "https://github.com/LuisJann/rdev", rev = "4d3d2d9d3b1bda08d711fc52c1dc2010c1b2e041", features = ["serialize", "unstable_grab", "macos_physical_key_events"] }
enigo = "0.1"
core-graphics = "0.23"
core-foundation = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
uuid = { version = "1.10", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"
png = "0.18"
tray-icon = "0.25.1"
